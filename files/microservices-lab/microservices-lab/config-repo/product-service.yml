# Served to product-service (matched by spring.application.name)
server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:productdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false        # best practice: no lazy loading in the web layer
    hibernate:
      ddl-auto: create-drop

product:
  low-stock-threshold: 5       # bound to ProductProperties (typed config)
  banner: "Hello from product-service (default profile)"   # read via @Value + @RefreshScope
