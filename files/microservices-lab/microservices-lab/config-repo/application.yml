# Served to EVERY config client (product-service, order-service, api-gateway).
# Put cross-cutting settings here; service-specific files override them.
spring:
  threads:
    virtual:
      enabled: true            # Java 21: Tomcat request threads + @Async run on virtual threads

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics
  endpoint:
    health:
      show-details: always
