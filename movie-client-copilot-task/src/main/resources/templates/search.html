<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Movie Search</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container py-4">
        <h1 class="mb-4">Movie Search</h1>
        <form method="post" th:action="@{/search}" class="row g-3 mb-4">
            <div class="col-md-8">
                <input type="text" class="form-control" name="query" th:value="${searchQuery}"
                    placeholder="Enter movie title">
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <div th:if="${movies != null and !movies.isEmpty()}">
            <h2>Results</h2>
            <ul class="list-group">
                <li class="list-group-item" th:each="movie : ${movies}">
                    <a th:href="@{/movies/{id}(id=${movie.id})}" th:text="${movie.title}"></a>
                    <span class="text-muted" th:text="'(' + ${movie.year} + ')'" th:if="${movie.year != null}"></span>
                </li>
            </ul>
        </div>
    </div>
</body>

</html>
