<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Movie Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container py-4" th:if="${movie != null}">
        <h1 class="mb-4" th:text="${movie.title}"></h1>
        <p><strong>Year:</strong> <span th:text="${movie.year}"></span></p>
        <p><strong>Genres:</strong> <span th:text="${#strings.listJoin(movie.genres, ', ')}"></span></p>
        <p><strong>Directors:</strong>
            <span th:each="director, iterStat : ${movie.directors}">
                <span th:text="${director.name}"></span><span th:if="${!iterStat.last}">, </span>
            </span>
        </p>
        <p><strong>Writers:</strong>
            <span th:each="writer, iterStat : ${movie.writers}">
                <span th:text="${writer.name}"></span><span th:if="${!iterStat.last}">, </span>
            </span>
        </p>
        <p><strong>Actors:</strong>
            <span th:each="actor, iterStat : ${movie.stars}">
                <span th:text="${actor.name}"></span><span th:if="${!iterStat.last}">, </span>
            </span>
        </p>
        <p><strong>Plot:</strong> <span th:text="${movie.plot}"></span></p>
        <p><strong>IMDb Rating:</strong> <span
                th:text="${movie.rating != null ? movie.rating.aggregateRating : 'N/A'}"></span></p>
        <a href="/search" class="btn btn-secondary mt-3">Back to search</a>
    </div>
</body>

</html>
